# DNS 配置可自行修改
port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: true
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      

# 当前 13 个主流协议节点配置模版，按需求修改，如不需要使用某协议节点，则无需删除，确保代理分流中没有该节点即可
proxies:

- name: 9916-eu-org                               # 可以自定义节点名称
  type: vless
  server: 443.zxing.eu.org                             # 解析的 IP / 域名或优选 IP / 域名
  port: 443                                      # 自定义端口
  uuid: c51b32f8-e06e-4905-ba0a-8ae01c2b66e0       # 自定义 UUID
  udp: false
  tls: true
  network: ws
  servername: kkk.9916.eu.org                         # SNI 域名，与下面 Host 一致
  ws-opts:
    path: "/?ed=2560"                              # 自定义 path 路径
    headers:
      Host: kkk.9916.eu.org                           # Host 域名，与上面 server 字段的地址一致

