# 分流组可自行创建或添加，proxies 参数下的节点名称，按需求自行增减，确保出现的节点名称在代理协议中可查找
proxy-groups:
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  
    - tr-9916-eu-org
    - tr-zxing-eu-org
    - tr-steven9916-eu-org
    - 9916-eu-org
    - zxing-eu-org
    - steven9916-eu-org


- name: 负载均衡
  type: load-balance
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:

    - tr-9916-eu-org
    - tr-zxing-eu-org
    - tr-steven9916-eu-org
    - 9916-eu-org
    - zxing-eu-org
    - steven9916-eu-org



   
- name: 🌍选择代理
  type: select
  proxies:
    - 自动选择                        # 自定义添加的节点名称
    - 负载均衡



   
